<script>
      (function(){
        var cfg = JSON.parse(document.getElementById('getbusy-cfg').textContent);
        var form = document.getElementById('getbusy-resend');
        var inp = document.getElementById('getbusy-email');
        var btn = document.getElementById('getbusy-submit');
        var out = document.getElementById('getbusy-status');
        var typo = document.getElementById('getbusy-typo');
        function say(t){ out.textContent = t; out.hidden = !t; }
        function checkTypo(){
          if (!typo || !cfg.typo_domains) return;
          var v = (inp.value || '').trim();
          var at = v.lastIndexOf('@');
          var fix = at > 0 ? cfg.typo_domains[v.slice(at + 1).toLowerCase()] : '';
          if (fix) {
            var sug = v.slice(0, at + 1) + fix;
            typo.hidden = false;
            typo.innerHTML = '';
            typo.appendChild(document.createTextNode((cfg.typo_hint || '{suggested}').replace('{suggested}', sug) + ' '));
            var b = document.createElement('button');
            b.type = 'button'; b.textContent = cfg.typo_apply || sug;
            b.addEventListener('click', function(){ inp.value = sug; typo.hidden = true; inp.focus(); });
            typo.appendChild(b);
          } else { typo.hidden = true; }
        }
        inp.addEventListener('input', function(){ inp.removeAttribute('aria-invalid'); checkTypo(); });
        inp.addEventListener('blur', checkTypo);
        form.addEventListener('submit', function(ev){
          ev.preventDefault();
          var v = (inp.value || '').trim();
          if (!v || !inp.validity.valid) { inp.setAttribute('aria-invalid', 'true'); say(cfg.bad); inp.focus(); return; }
          inp.removeAttribute('aria-invalid');
          btn.disabled = true;
          say('');
          var body = new URLSearchParams();
          body.set('email', v);
          var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
          var tid = ctrl ? setTimeout(function(){ ctrl.abort(); }, cfg.timeout_ms || 12000) : null;
          fetch(cfg.url, {
            method: 'POST',
            body: body,
            signal: ctrl ? ctrl.signal : undefined
          }).then(function(r){
            say(r.ok ? cfg.ok : cfg.err);
          }, function(){
            say(cfg.err);
          }).finally(function(){ if (tid) clearTimeout(tid); btn.disabled = false; });
        });
      })();
