  - day: 2
    date: 9 сентября
    theme: Дорогой модернизм
    notes:
    - 'Le Corbusier две точки: Maison La Roche (1923–25, ныне Fondation Le Corbusier)
      и Molitor (1933, квартира архитектора).'
    - Десятилетие между постройками — эволюция от raumplan-эксперимента к зрелой жилой
      модели.
    - Авторская прогулка по Marais.
    - Archives Nationales (Hôtel de Soubise) — рококовые интерьеры и внутренний двор.
    - Dover Street Market и Uniqlo — историческая архитектура, переосмысленная ритейлом.
    - Gentle Monster — корейская концепция ритейла-как-инсталляции.
    evening: paris_design_week
  - day: 3
    date: 10 сентября
    theme: Человечный модернизм
    notes:
    - Maison Louis Carré (Bazoches-sur-Guyonne, ≈45 минут от Парижа) — 1956–58, единственное
      здание Alvar Aalto во Франции, заказчик Louis Carré, парижский галерист и коллекционер.
    - В сентябре в стенах виллы — выставка «Being There» (Arno Rafael Minkkinen, Gaspard
      Noël).
    - Парк по проекту Aalto — пикник при хорошей погоде.
    - Кожаные ручки, волнистый потолок, многоуровневые пространства — эргономика как
      забота.
    - Мастер-класс Ирины Маркман на её объекте «Парижская квартира» — теория, проверяемая
      в практике.
  - day: 4
    date: 11 сентября
    theme: Искусство и дизайн
    notes:
    - Musée Zadkine (100bis rue d'Assas) — недавно открывшийся после реновации (май
      2026).
    - 'Осип Цадкин: представитель «Парижской школы»; влияние на «органический минимализм»
      в интерьере XX века.'
    - Дизайн-прогулки по галереям Saint-Germain — район, где дизайн XX века собран
      как коллекционное искусство.
    - Ужин в культовом ресторане.
    - Итоги.
