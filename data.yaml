  inclusions:
    model: all_except
    excluded:
    - airfare_international
    note: Включает всё (проживание, питание, локальный transfer, мастер-классы, экскурсии,
      сертификация), кроме международных авиабилетов.
  transport:
    mode: avia
    airfare:
      required: true
      options:
      - mode: self_purchase
        surcharge_pct: 0
      - mode: agent_purchase
        surcharge_pct: null      # ⊥ — не засвидетельствовано; принципал 2026-09-02 отрицает
      scheduled_flights:
        # ССЫЛКА НА ПРОГОН ПЛЕЧА, а не копия его часов: времена и дни живут у
        # `transport_legs`, и второй их дом здесь протух бы молча при смене расписания.
        inbound:
          leg: msk_bhk_night
          run: SU 1876
          decided: false           # ПРЕДЛОЖЕНИЕ, не решение: принципал 2026-09-02 —
                                   # «Зафиксируй предлагаемый рейс. В текст не вноси, я сам»
          proposed: 2026-09-02
          why: >-
            Из трёх субботних посадок (HY 9908 03:30, UT 807 04:15, SU 1876 06:10; C6 414
            по субботам не летает) этот единственный не трогает пятницу: вылет Шереметьево
            00:10 приходится уже на субботние сутки, из дома около 20:45, а пятница рабочая
            по объявленному календарю аудитории. Посадка на рассвете даёт заселение около
            семи утра — час, в который отель работает, — вместо побудки среди ночи.
            ПРОТИВ, честно: постельная ночь короче объявленного порога эргономичности
            (min_overnight_gap_hours) — около шести с половиной часов до позднего обеда
            против девяти с половиной у HY 9908; перекрывается сном в полёте и тем, что
            суббота объявлена днём отдыха без учебной нагрузки.
        outbound: null             # ⊥ — не зафиксирован; письмо называет вылет 05:45 четверга
      note: Авиабилеты на заданные рейсы. Самостоятельно или через нашего менеджера
        (наценка уточняется).
    arrival_protocol:
      default:
        mode: centralized
        note: Встреча в аэропорту → вместе в Узбекистане → вместе обратно.
      alternative:
        mode: flexible_dates
        constraints:
          arrive_no_later_than: null
          depart_no_earlier_than: null
        note: Путешественник может определить даты прилёта/вылета произвольно в рамках
          границ.
