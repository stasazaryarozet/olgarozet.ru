# ЛИСТА: он несет наборный блок «"Flying Horse Verdon" / handmade paper, tempera, graphite /
# 64x88 cm»; год — с подписи Ольги в правом нижнем углу («Розет О. 2010»).
# ИМЯ ДАНО ПРИНЦИПАЛОМ 2026-09-02 правкой поста: «Лошадь Вердонского ущелья» → «Пегас
# Вердонского ущелья». Поле `title_original` при этом ПУСТО, и это не утрата: русское имя ЕСТЬ
# перевод листового («flying horse» = Пегас, Verdon = Вердонское ущелье), а два дома одного
# имени — повтор, который сам же принципал и снял. Листовой блок сохранен здесь, строкой выше.
# Он же (файл c256cc08-3961-428d-b288-1fc9b0ce481f @ force-power): наборный блок снять с
# изображения, в /art — версия без него; карусель из двух кадров — работа на белом целиком и
# увеличение. Кадры объявлены в `views` и ВЫВОДЯТСЯ из адреса содержания.
- source: e3c26bd0fa4eca39dc843d631350df206e80bf38dc6830a245c323c59371fceb   # Сын/14279, подпись 14280 «это проданная работа»
  title: Пегас Вердонского ущелья
  ground: бумага ручной работы
  media: [графит, темпера]
  size: 64×88
  year: 2010
  # ГРУНТ ЛИСТА ПРИВОДИТСЯ К БЕЛОМУ (entity-artwork::ground_white). Замер снимка 2026-09-02:
  # основная масса листа стоит на [238, 230, 229] — тепло-серый. Принципал снял по этой причине
  # уже опубликованный пост: «цвет бумаги был неприятным». У работ на КАРТОНЕ поля нет и быть не
  # может: там цвет грунта есть сама работа.
  ground_white: true
  # ДЕТАЛИЗАЦИЯ (entity-artwork::detail): штрих реконструируется моделью на карте узла,
  # фактура листа при этом ВОССТАНАВЛИВАЕТСЯ до записанной снимком, а не выдумывается.
  detail: true
  views:
    # ОБЛАСТИ ОБЪЯВЛЕНЫ, А НЕ ИЗМЕРЕНЫ ПОРОГАМИ (art_views: paper.md::Inv-PAPER-crop-is-measure
    # запрещает решать о множестве пикселей подобранным числом). Координаты — в СНИМКЕ
    # e3c26bd0, замерены один раз и записаны здесь как декларация, по образцу временного
    # отрезка клипа (subsystem-media-clips::Declaration).
    - {name: sheet, box: [37, 37, 2524, 1778]}     # сам лист: набранный блок под ним отсечен
    - {name: head, box: [948, 111, 2098, 1031]}    # увеличение: голова лошади — второй перцептивный ярус
  note:
    # ПРОЗА НАБРАНА ПРИНЦИПАЛОМ 2026-09-02 — это его правка, а не пересказ его файла. Она
    # короче прежней вдвое, и каждое сокращение имеет причину: топоним не повторяется (его
    # несет название), основа не повторяется (ее несут поля), двойное изображение не
    # объясняется словами — второй кадр карусели показывает его сам.
    - - Крутые известняковые стены
      - и вода особого цвета.
    - - "Бирюза, циан, серый, окись хрома:"
      - палитра листа совпадает
      - с водой и минералами
      - этого места.
    - - "Бумага неровной плотности:"
      - фактура участвует в распределении пигмента.
    - - Графит держит каркас;
      - темпера лежит поверх
      - местными лессировками
      - и его не закрывает.
    - - Больше половины листа
      - не тронуто пигментом —
      - можно увидеть,
      - как «работает» пустота
  # ПОСЛЕДНЕЕ СЛОВО — отдельная часть кадра, отбитая знаком ранга `part`. Цена («800 или 900 €»)
  # снята принципалом при наборе, хотя его же файл ею заканчивал: правка старше файла.
  closing:
    - - Теперь эту работу анонимно (!) купили
