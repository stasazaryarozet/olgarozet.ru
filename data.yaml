    theme: Система вкуса
    notes:
    - Утро — встречаемся в уникальном пространстве с парижскими крышами в окнах, где
      работают, пьют кофе, общаются.
    - 'Вводная лекция «Сто лет обещаний»: ключевые точки модернизма — от Парижской
      выставки Arts Décoratifs 1925 до Le Modulor.'
    - Maison & Objet (4–8 сентября, Parc des Expositions Villepinte) — наши рекомендации,
