# ── Подкаст (entity-podcast.md; вид `podcast` рода entity-broadcast) ──────────────
# Экземпляр Вещания. Вид ТОТАЛЕН: {cardinality: broadcast, synchrony: async,
# modality: audio, addressing: pull, enumeration: series} — все пять осей связаны.
# Лента, обложка и вложения — ПРОЕКЦИЯ (scripts/podcast_rss.py --materialize);
# домом байтов остаётся реестр Материалов, домом факта — эта строфа.
podcasts:
- id: olga-rozet
  species: podcast
  slug: podcast
  title: Ольга Розет
  author: Ольга Розет
  email: o.g.rozet@gmail.com
  language: ru
  category: Design
  cover: olga_footer.png
  link: https://olgarozet.ru
  # ВЛАДЕЛЕЦ УЧЁТНОЙ ЗАПИСИ ПЛОЩАДКИ — решение принципала 2026-08-19, дословно «Владелец — Ольга».
  # Записано ДАННЫМИ, а не в переписке: подача ленты в каталоги (Apple / Spotify) обязана знать,
  # под кем регистрироваться, и не спрашивать человека второй раз. Решение принято один раз и живёт.
  # У Системы сегодня НЕТ подкаст-учётки Ольги (есть чужие персоны) — это названный разрыв,
  # закрываемый регистрацией на её же почту, а не сменой владельца на удобного.
  platform_account_owner: olgarozet
  description: 'Разговор об архитектуре, дизайне и искусстве — и об очень интересных
    моментах, которые уже произошли в истории или ещё только будут. Ведёт Ольга Розет:
    художник, историк искусства, практикующий дизайнер интерьеров, преподаватель
    Британской высшей школы дизайна.'
  # Ряд эпизодов — В ПОРЯДКЕ (ось enumeration: series). Всё об эпизоде, кроме описания,
  # уже записано у Материала: имя — монтажным решением клипа, время — наблюдением,
  # MIME и длительность — замером. Описание живёт ЗДЕСЬ, потому что здесь его первый дом.
  #
  # ЭПИЗОД АДРЕСУЕТСЯ МОНТАЖНЫМ РЕШЕНИЕМ (`clip:`), А НЕ БАЙТАМИ. Первая редакция
  # ссылалась на oid — и первое же улучшение дорожки (lumen, 2026-08-19: audio_chain
  # получил sample_rate 48000, одна строка данных) сменило ВСЕ ШЕСТЬ oid. Ссылка на байты
  # означала бы ручную правку этой строфы при каждом улучшении качества, то есть
  # человеческое усилие, РАСТУЩЕЕ с качеством. Имя объявления стабильно; лента следует
  # за перевыпуском сама. (`oid:` остаётся для эпизода, который не клип.)
  episodes:
  - clip: welcome          # 26 c · собственная запись 2026-08-17, дубль 3 из трёх
    type: trailer
    description: 'Ольга Розет представляет канал: об архитектуре, дизайне, искусстве —
      и о том, что связано с интерьерной практикой, декоративным искусством и созданием
      предметной среды.'
  - clip: obeshchanie-veka-chelovek          # 86 c · эфир 08.07.2026, 12:48–16:52
    description: '«Каждому достанется комфортное жильё; города, где меньше бытовых забот,
      а больше культуры и креатива». Почему главное обещание XX века было про человека —
      и почему красивая среда должна принадлежать всем, а не только верхнему этажу.'
  - clip: spalnya-na-vysokikh-nogakh          # 77 c · эфир 08.07.2026, 18:19–21:25
    description: 'Спальня Ле Корбюзье на очень высоких ногах — что это и зачем. Дом как
      машина для жилья против географии Алвара Аалто: небо, озёра, земля и дерево. Формула
      баланса между модернизмом и человечностью, которая держится до сих пор.'
  - clip: prozhivat-telom          # 99 c · эфир 08.07.2026, 27:06–30:39
    description: 'Архитектуру проживать телом. Потрогать материалы, подышать воздухом,
      который создаёт объём помещения, видеть оригиналы: на слайдах мы воспринимаем
      только 15 % — много, но недостаточно. Тело — это не только глаза.'
  - clip: tochka-sborki          # 82 c · эфир 08.07.2026, 31:56–33:39
    description: '«Всем — это кому?» XX век хорошо подумал о том, как было бы хорошо всем,
      и мечты частью разбились. Сегодня мы в точке сборки: высеять те зёрна, что отвечают
      сегодняшнему дню, помня, что мир опять меняется.'
  - clip: pozhit-u-aalto          # 56 c · эфир 08.07.2026, 37:34–38:21
    description: 'Где бы пожить — у Аалто или у Корбюзье? Ольга отвечает парадоксом:
      перестройка собственного дома шла по Корбюзье, потому что он отвечал задачам семьи.
      Однозначных ответов нет — и это приглашение к разговору.'

# ── ПЛЕЧА: обитатели того же рода, что `places` ────────────────────────────────
# `_open_state` читает у записи ровно две колонки — `availability` (ось периода) и часы
# (ось недели). Рейс несет ту же пару точь-в-точь, поэтому отдельного механизма нет:
# закон о часах музея судит и расписание самолета (event_invariants._schedulables).
#
# ЧАСЫ ЗДЕСЬ НЕ ПИШУТСЯ РУКОЙ. Объявляется `runs` — порождающая расписания, по рейсу на
# строку со своими днями; огибающая {день: интервалы} ВЫВОДИТСЯ (_derived_hours). Прежде
# здесь стояла рукописная огибающая, и она несла ОДНО окно на все семь дней: 05:25-10:00
# в том числе на четверг, тогда как 10:00 — это HH 709, летающий только по воскресеньям.
# Ошибка в четыре часа пятнадцать минут жила там, где индекс по дню недели был, а
# зависимости от дня не было. Одновременно объявить `runs` и `hours` запрещено законом
# Inv-SCHED-hours-single-home: два дома одного факта расходятся молча.
#
# ДНИ РЕЙСА стоят в системе отсчета `indexed_by` этого плеча. У ночного плеча индекс —
# день ПРИЛЕТА, поэтому `days` там прилетные, а сторона отправления (со своим днем) —
# в `note` рейса, рядом с источником. Пересчет сделан один раз, при внесении.
#
# ПОЛНОТА ПЕРЕЧНЯ есть свойство ЗАМЕРА, а не мира: отсутствие рейса в этом списке значит
# «не измерен», а закон прочтет такой день закрытым — и это верное умолчание, потому что
# полет есть положительный акт и ему нужно положительное свидетельство. Ровно обратную
# ошибку я сделала 2026-09-02, отчеканив «в четверг прямого нет» из неполного перечня
# перевозчиков (опровергнут Centrum Air): вердикт из кандидатуры, а не из держания.
transport_legs:
  msk_bhk_night:
    name: Москва → Бухара, ночной прямой
    kind: flight
    indexed_by: arrival_weekday        # `days` рейсов — дни ПРИЛЕТА: плечо есть то, чем
                                       # день 1 начинается, и мерить его надо в его сутках
    availability:
    - {from: 2026-10-25, to: 2027-03-23, label: зимнее расписание 2026/27}
    runs:
    - id: HY 9908
      carrier: Uzbekistan Airways
      at: "03:30"
      days: [tue, thu, sat]
      departs: {airport: Внуково, at: "21:35", day: накануне}
      note: дни вылета — пн, ср, пт
    - id: UT 807
      carrier: Utair
      at: "04:15"
      days: [mon, tue, wed, thu, sat, sun]
      departs: {airport: Внуково, at: "22:25", day: накануне}
      note: вылет все дни кроме чт
    - id: C6 414
      carrier: Centrum Air
      at: "02:10"
      days: [mon, wed, fri, sun]
      departs: {airport: Домодедово, at: "20:15", day: накануне}
      note: дни вылета — вт, чт, сб, вс
    - id: SU 1876
      carrier: Аэрофлот
      at: "06:10"
      days: [wed, fri, sat, sun]
      departs: {airport: Шереметьево, at: "00:10", day: тех же суток}
      note: >-
        Дни ВЫВЕДЕНЫ, а не сняты: борт
        разворачивается в Бухаре за 80 минут и уходит обратно рейсом SU 1877 07:30, чьи
        дни (ср, пт, сб, вс) подтверждены двумя источниками; оба рейса объявлены как
        4 раза в неделю и оба показывают среду
    source: avia.tutu.ru · rasp.yandex.ru · aviasales.ru (замер 2026-09-02)
    note: >-
      Прилет возможен ЛЮБЫМ днем недели — объединение четырех перевозчиков покрывает все
      семь. Выведенная огибающая по дням: пн 02:10-04:15, вт 03:30-04:15, ср 02:10-06:10,
      чт 03:30-04:15, пт 02:10-06:10, сб 03:30-06:10, вс 02:10-06:10.
  oldtown_bhk_ground:
    name: Старый город ↔ аэропорт Бухары
    kind: ground
    duration_min: 20                   # 5-6 км, 10-15 минут ходом; 20 — с запасом
    source: kupibilet.ru/gid · orexca.com · rome2rio (замер 2026-09-02)
    note: >-
      Один узел на оба конца поездки: этой же дорогой группу везут из аэропорта в отель
      в день прилета. Записанная дважды, она разошлась бы молча.
  bhk_msk_morning:
    name: Бухара → Москва
    kind: flight
    indexed_by: departure_weekday
    availability:
    - {from: 2026-09-30, to: 2027-03-25, label: зимнее расписание 2026/27}
    runs:
    - id: HY 9907
      carrier: Uzbekistan Airways
      at: "05:25"
      days: [tue, thu, sat]
      arrives: {airport: Внуково, at: "07:35"}
      note: летний код того же слота — HY 9607
    - id: UT 808
      carrier: Utair
      at: "05:45"
      days: [tue, thu, sat, sun]
      arrives: {airport: Внуково, at: "07:55"}
      note: >-
        Дни СПОРНЫ: rasp.yandex и avia.tutu дают четверг
        (сентябрьские вылеты 3, 10, 17, 24), третий источник дает вт-пт-вс на зиму. Взяты
        два согласных против одного; на ответ «последний вылет в четверг» спор не влияет —
        без этого рейса остается HY 9907 в 05:25, те же полшестого утра
    - id: SU 1877
      carrier: Аэрофлот
      at: "07:30"
      days: [wed, fri, sat, sun]
      arrives: {airport: Шереметьево, at: "09:50"}
      note: четверга НЕТ — согласны два источника
    - id: HH 709
      carrier: Qanot Sharq
      at: "10:00"
      days: [sun]
      arrives: {airport: Домодедово, at: "12:10"}
      note: по 31.01 включительно
    lead:                              # цепь стадий ПЕРЕД вылетом; час выселения ВЫВОДИТСЯ
    - {stage: дорога до аэропорта, leg: oldtown_bhk_ground}
    - stage: аэропорт до вылета
      minutes: 120
      source: >-
        закрытие регистрации за 40 минут до вылета — общее правило; два часа взяты как
        срок ДЛЯ ГРУППЫ 18 человек с багажом на международном вылете, с запасом на один
        автобус и одну стойку
    source: rasp.yandex.ru · avia.tutu.ru · aviasales.ru · uniticket (замер 2026-09-02)
    note: >-
      ВЕЧЕРНЕГО прямого нет НИ В ОДИН день недели — вылеты укладываются в 05:25-10:00, и в
      этом согласны все четыре источника. Вечерний отъезд возможен только с пересадкой в
      Ташкенте (вылет из Бухары 21:55) — это ДРУГОЕ плечо, и оно здесь не объявлено, пока
      не замерено так же хорошо. Самый поздний вылет недели — 10:00, но он воскресный;
      второй по позднему — 07:30, и его дни ср, пт, сб, вс. В понедельник ни один из
      замеренных рейсов не летит.
