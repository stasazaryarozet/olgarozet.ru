<script>
const footer = document.querySelector('.footer-content');
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
}, { threshold: 0.1 });
document.addEventListener('click', (ev) => {
  const act = ev.target && ev.target.closest && ev.target.closest('[data-action]');
  if (!act) return;
  const kind = act.getAttribute('data-action');
  if (kind === 'scroll-top') { ev.preventDefault(); window.scrollTo(0, 0); }
  else if (kind === 'print') {
    const waits = Array.from(document.querySelectorAll('img[loading="lazy"]')).map((img) => {
      img.loading = 'eager';
      return img.complete ? Promise.resolve() : new Promise((r) => { img.addEventListener('load', r, { once: true }); img.addEventListener('error', r, { once: true }); });
    });
    Promise.race([Promise.all(waits), new Promise((r) => setTimeout(r, 3500))]).then(() => window.print());
  }
});
observer.observe(footer);
</script>

<script>
(function(){
  function _applyWindows(){
    var nodes = document.querySelectorAll('[data-visible-until],[data-visible-from]');
    var now = Date.now();
    for (var i = 0; i < nodes.length; i++) {
      var from = Date.parse(nodes[i].getAttribute('data-visible-from') || '');
      var until = Date.parse(nodes[i].getAttribute('data-visible-until') || '');
      var vis = (isNaN(from) || now >= from) && (isNaN(until) || now < until);
      nodes[i].style.display = vis ? '' : 'none';
      nodes[i].hidden = !vis;
    }
  }
  _applyWindows();
  setInterval(_applyWindows, 30000);
})();

(function(){
  var slug = (document.querySelector("meta[name=\"page-slug\"]") || {}).content;
  if (!slug) return;
  var payload = JSON.stringify({
    p: slug,
    r: (window.crypto && crypto.randomUUID) ? crypto.randomUUID() :
       (Date.now() + '-' + Math.random().toString(36).slice(2)),
    ref: document.referrer || ''
  });
  var url = null;
  if (!url) return;
  try {
    var blob = new Blob([payload], { type: 'application/json' });
    if (!navigator.sendBeacon || !navigator.sendBeacon(url, blob)) {
      fetch(url, {
        method: 'POST', body: payload, keepalive: true,
        headers: { 'Content-Type': 'application/json' }
      }).catch(function(){});
    }
  } catch (e) { /* swallow */ }
})();
</script>
